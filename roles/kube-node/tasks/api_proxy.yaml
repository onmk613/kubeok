# 本地 API 代理 | Local nginx proxy for kube-apiserver
- name: ApiProxy | Ensure nginx config directory exists | 创建 nginx 配置目录
  ansible.builtin.file:
    path: "/etc/kubernetes/nginx"
    state: directory
    mode: "0755"

- name: ApiProxy | Render nginx config file | 渲染 nginx 配置文件
  ansible.builtin.template:
    src: "nginx.conf.j2"
    dest: "/etc/kubernetes/nginx/nginx.conf"
    mode: "0644"

- name: ApiProxy | Copy static pod manifest | 下发静态 Pod 清单
  ansible.builtin.copy:
    src: "api-proxy.yaml"
    dest: "/etc/kubernetes/manifests/api-proxy.yaml"
    mode: '0644'
