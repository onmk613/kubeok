# kube-node 清理阶段 | Optional cleanup phase
- name: Node | Run cleanup tasks when enabled | 按需执行清理任务
  ansible.builtin.include_tasks: "clean_kube_node.yaml"
  when: kube_node_clean

# 变量计算 | Build runtime facts
- name: Node | Set node IP fact | 生成节点 IP 变量
  ansible.builtin.set_fact:
    kube_node_ip: "{{ internal_ip | default(ansible_host) }}"

- name: Node | Set kubelet hostname override | 设置 kubelet 主机名覆盖值
  ansible.builtin.set_fact:
    kube_node_name: "{{ kube_node_ip if use_ip_as_hostname else inventory_hostname }}"

- name: Node | Skip installation when disabled | 按配置跳过安装
  ansible.builtin.meta: end_host
  when: kube_node_no_install | bool

# 如果没有设置kube_master_lb地址, 那么就用静态nginx Pod代理kube-apiserver
- name: Node | Build kube-apiserver endpoint | 生成 kube-apiserver 访问地址
  ansible.builtin.set_fact:
    kube_master_endpoint: >-
      {{
        kube_master_lb if kube_master_lb is defined else 'https://127.0.0.1:' + (kube_apiserver_port | string)
      }}

