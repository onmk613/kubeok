# 目录准备 | Prepare required directories
- name: Node | Ensure kubelet and containerd dirs exist | 创建 kubelet/containerd 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "/etc/kubernetes/manifests"
    - "/etc/containerd"

# 二进制下发 | Deploy binaries
- name: Node | Copy kube binaries | 下发 kube 二进制
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/packages/kube/{{ ansible_architecture }}/{{ item }}"
    dest: "{{ bin_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - "kubelet"
    - "kube-proxy"
    - "crictl"

- name: Node | Copy containerd binaries | 下发 containerd 二进制
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/packages/containerd/{{ ansible_architecture }}/{{ item }}"
    dest: "{{ bin_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - "containerd"
    - "containerd-shim-runc-v2"
    - "containerd-stress"
    - "ctr"
    - "runc"

# 配置文件下发 | Deploy configs
- name: Node | Render containerd config | 渲染 containerd 配置
  ansible.builtin.template:
    src: "config.toml.j2"
    dest: "/etc/containerd/config.toml"
    mode: "0644"

- name: Node | Render crictl config | 渲染 crictl 配置
  ansible.builtin.template:
    src: "crictl.yaml.j2"
    dest: "/etc/crictl.yaml"
    mode: "0644"

- name: Node | Render kubelet and kube-proxy configs | 渲染 kubelet/kube-proxy 配置
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/kubernetes/{{ item }}"
    mode: "0644"
  loop:
    - "kube-proxy.yaml"
    - "kubelet.yaml"

- name: Node | Generate TLS certificates | 生成 TLS 证书
  ansible.builtin.include_tasks: "gen_ssl.yaml"

- name: Node | Deploy local API proxy manifest when no LB | 无 LB 时部署本地 API 代理
  ansible.builtin.include_tasks: "api_proxy.yaml"
  when: kube_master_lb is not defined

# 服务管理 | Service management
- name: Node | Render systemd unit files | 渲染 systemd 服务文件
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - "containerd.service"
    - "kube-proxy.service"
    - "kubelet.service"

- name: Node | Reload systemd and stop old services | 重载 systemd 并停止旧进程
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  failed_when: false
  loop:
    - "containerd"
    - "kube-proxy"
    - "kubelet"

- name: Node | Ensure kubelet and containerd running | 确保 kubelet/containerd 运行
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - "containerd"
    - "kubelet"

- name: Node | Ensure kube-proxy running when enabled | 按需启动 kube-proxy
  ansible.builtin.systemd:
    name: "kube-proxy"
    state: started
    enabled: true
  when: not cilium_replace_kube_proxy

- name: Node | Import offline images when enabled | 按需导入离线镜像
  ansible.builtin.include_tasks: "load_images.yaml"
  when: offline_pull_images
