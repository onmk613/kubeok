- name: Clean | Stop and disable kube-node service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - "kubelet"
    - "kube-proxy"
    - "containerd"

- name: Clean | Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Clean | Remove kube-node mount points
  become: true
  ansible.builtin.shell: |
    for i in $(grep {{ item }} /proc/mounts | awk '{print $2}'); do
      echo "Unmounting $i"
      umount -l $i || true
    done
  args:
    executable: /bin/bash
  failed_when: false
  loop:
    - kubelet
    - containerd

- name: Clean | Remove kube-node data files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bin_dir }}/kubelet"
    - "{{ bin_dir }}/kube-proxy"
    - "/etc/kubernetes/kube-proxy.yaml"
    - "/etc/kubernetes/kubelet.yaml"
    - "/etc/kubernetes/nginx"
    - "/etc/kubernetes/manifests"
    - "{{ bin_dir }}/crictl"
    - "{{ bin_dir }}/containerd"
    - "{{ bin_dir }}/containerd-shim-runc-v2"
    - "{{ bin_dir }}/containerd-stress"
    - "{{ bin_dir }}/ctr"
    - "{{ bin_dir }}/runc"
    - "/etc/systemd/system/kubelet.service"
    - "/etc/systemd/system/kube-proxy.service"
    - "/etc/systemd/system/containerd.service"
    - "/etc/containerd/config.toml"
    - "{{ containerd_data_dir }}"
    - "{{ kubelet_data_dir }}"

- name: Clean | Kill nginx proxy process if exists
  become: true
  ansible.builtin.shell: "pgrep nginx | xargs kill -9"
  args:
    executable: /bin/bash
  failed_when: false
