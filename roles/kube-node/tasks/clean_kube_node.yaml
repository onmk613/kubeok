# kube-node 清理流程 | Cleanup flow
- name: Clean | Stop and disable node services | 停止并禁用节点服务
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - "kubelet"
    - "kube-proxy"
    - "containerd"

- name: Clean | Reload systemd daemon | 重载 systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Clean | Unmount kubelet and containerd mount points | 卸载 kubelet/containerd 挂载点
  become: true
  ansible.builtin.shell: |
    for i in $(grep {{ item }} /proc/mounts | awk '{print $2}'); do
      echo "Unmounting $i"
      umount -l $i || true
    done
  args:
    executable: /bin/bash
  failed_when: false
  loop:
    - kubelet
    - containerd

- name: Clean | Remove node binaries and data | 删除节点程序与数据
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bin_dir }}/kubelet"
    - "{{ bin_dir }}/kube-proxy"
    - "/etc/kubernetes/kube-proxy.yaml"
    - "/etc/kubernetes/kubelet.yaml"
    - "/etc/kubernetes/nginx"
    - "/etc/kubernetes/manifests"
    - "{{ bin_dir }}/crictl"
    - "{{ bin_dir }}/containerd"
    - "{{ bin_dir }}/containerd-shim-runc-v2"
    - "{{ bin_dir }}/containerd-stress"
    - "{{ bin_dir }}/ctr"
    - "{{ bin_dir }}/runc"
    - "/etc/systemd/system/kubelet.service"
    - "/etc/systemd/system/kube-proxy.service"
    - "/etc/systemd/system/containerd.service"
    - "/etc/containerd/config.toml"
    - "{{ containerd_data_dir }}"
    - "{{ kubelet_data_dir }}"

- name: Clean | Kill residual nginx proxy process | 终止残留 nginx 代理进程
  become: true
  ansible.builtin.shell: "pgrep nginx | xargs kill -9"
  args:
    executable: /bin/bash
  failed_when: false
