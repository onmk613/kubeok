# etcd 清理阶段 | Optional cleanup phase
- name: Etcd | Run cleanup tasks when enabled | 按需执行清理任务
  ansible.builtin.include_tasks: "clean_etcd.yaml"
  when: etcd_clean

# etcd 变量计算 | Build local and cluster vars
- name: Etcd | Build host and initial cluster facts | 生成主机与集群变量
  ansible.builtin.set_fact:
    etcd_host: "{{ internal_ip | default(ansible_host) }}"
    etcd_initial_cluster: >-
      {%- set cluster = [] -%}
      {%- for host in groups['etcd'] -%}
        {%- set name = hostvars[host]['inventory_hostname'] -%}
        {%- set ip = hostvars[host]['internal_ip'] | default(hostvars[host]['ansible_host']) -%}
        {%- set port = hostvars[host]['etcd_peer_port'] | default(etcd_peer_port) -%}
        {%- set _ = cluster.append(name ~ '=https://' ~ ip ~ ':' ~ port) -%}
      {%- endfor -%}
      {{ cluster | join(',') }}

- name: Etcd | Skip installation when disabled | 按配置跳过安装
  ansible.builtin.meta: end_host
  when: etcd_no_install

# etcd 安装阶段 | Install binaries and certs
- name: Etcd | Copy binaries to node | 下发 etcd 二进制
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/packages/etcd/{{ ansible_architecture }}/{{ item }}"
    dest: "{{ bin_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - "etcd"
    - "etcdctl"
    - "etcdutl"

- name: Etcd | Generate TLS certificates | 生成 TLS 证书
  ansible.builtin.include_tasks: "gen_ssl.yaml"

- name: Etcd | Configure backup jobs when enabled | 按需配置备份任务
  ansible.builtin.include_tasks: "backup_etcd.yaml"
  when: etcd_backup

# etcd 服务配置 | Service configuration
- name: Etcd | Render systemd unit file | 渲染 systemd 服务文件
  ansible.builtin.template:
    src: "etcd.service.j2"
    dest: "/etc/systemd/system/etcd.service"
    mode: '0644'

- name: Etcd | Reload systemd and stop old process | 重载 systemd 并停止旧进程
  ansible.builtin.systemd:
    name: "etcd"
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Etcd | Ensure service is enabled and running | 确保服务开机自启并运行
  ansible.builtin.systemd:
    name: "etcd"
    state: started
    enabled: true

# 健康检查 | Health check
- name: Etcd | Check endpoint health | 检查集群健康状态
  ansible.builtin.command: "{{ bin_dir }}/etcdctl endpoint health --cluster -w table"
  register: etcd_health
  retries: 5
  delay: 5
  until: etcd_health.rc == 0
  changed_when: false
  environment:
    ETCDCTL_API: "3"
    ETCDCTL_CACERT: "{{ etcd_cert_dir }}/etcd-ca.pem"
    ETCDCTL_CERT: "{{ etcd_cert_dir }}/etcd.pem"
    ETCDCTL_KEY: "{{ etcd_cert_dir }}/etcd-key.pem"
    ETCDCTL_ENDPOINTS: "https://127.0.0.1:{{ etcd_client_port }}"

- name: Etcd | Show health check output | 输出健康检查结果
  ansible.builtin.debug:
    msg: "{{ etcd_health.stdout_lines }}"
