# kube-master 清理流程 | Cleanup flow
- name: Clean | Stop and disable control-plane services | 停止并禁用控制面服务
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - "kube-apiserver"
    - "kube-controller-manager"
    - "kube-scheduler"

- name: Clean | Reload systemd daemon | 重载 systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Clean | Remove control-plane binaries and configs | 删除控制面程序与配置
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ bin_dir }}/kube-apiserver"
    - "{{ bin_dir }}/kube-controller-manager"
    - "{{ bin_dir }}/kube-scheduler"
    - "{{ bin_dir }}/kubectl"
    - "{{ bin_dir }}/helm"
    - "{{ ansible_env.HOME }}/.kube"
    - "/etc/systemd/system/kube-apiserver.service"
    - "/etc/systemd/system/kube-controller-manager.service"
    - "/etc/systemd/system/kube-scheduler.service"
    - "{{ audit_policy_file }}"
    - "{{ audit_log_path }}"
