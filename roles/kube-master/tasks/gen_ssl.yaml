# 证书生成 | TLS assets for control-plane
- name: TLS | Ensure kube cert directory exists | 创建证书目录
  ansible.builtin.file:
    path: "{{ kube_cert_dir }}"
    state: directory
    mode: '0755'

- name: TLS | Copy CA files to control-plane node | 下发 CA 文件
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/packages/ssl/{{ item }}"
    dest: "{{ kube_cert_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - "ca-config.json"
    - "etcd-ca.pem"
    - "etcd-ca-key.pem"
    - "k8s-ca.pem"
    - "k8s-ca-key.pem"

- name: TLS | Generate control-plane certificates | 生成控制面证书
  ansible.builtin.script: "gen_ssl.sh"
  environment:
    cluster_ip: "{{ cluster_ip }}"
    kube_cert_dir: "{{ kube_cert_dir }}"
    kube_master_ip: "{{ kube_master_ip }}"
    cluster_domain: "{{ cluster_domain }}"
    kube_master_lb: "{{ kube_master_lb | default(kube_master_ip) }}"
    kube_apiserver_port: "{{ kube_apiserver_port }}"
