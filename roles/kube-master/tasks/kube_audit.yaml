# 审计日志配置 | Audit policy and log directories
- name: Audit | Ensure audit directories exist | 创建审计目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ audit_policy_file | dirname }}"
    - "{{ audit_log_path | dirname }}"

- name: Audit | Deploy audit policy file | 下发审计策略文件
  ansible.builtin.copy:
    src: "audit-policy.yaml"
    dest: "{{ audit_policy_file }}"
    mode: '0644'
