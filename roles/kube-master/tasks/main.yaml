# kube-master 清理阶段 | Optional cleanup phase
- name: ControlPlane | Run cleanup tasks when enabled | 按需执行清理任务
  ansible.builtin.include_tasks: "clean_kube_master.yaml"
  when: kube_master_clean

# 变量计算 | Build runtime facts
- name: ControlPlane | Set master node IP fact | 生成 master 节点 IP 变量
  ansible.builtin.set_fact:
    kube_master_ip: "{{ internal_ip | default(ansible_host) }}"

- name: ControlPlane | Build stacked etcd endpoint | 生成堆叠模式 etcd 地址
  ansible.builtin.set_fact:
    etcd_servers: >-
      {%- set matches = [] -%}
      {%- for host in groups['etcd'] -%}
        {%- if hostvars[host]['etcd_host'] == kube_master_ip -%}
          {%- set _ = matches.append(hostvars[host]['etcd_client_port'] | default(2379)) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if matches | length > 0 -%}
        https://127.0.0.1:{{ matches[0] }}
      {%- else -%}
        https://127.0.0.1:2379
      {%- endif -%}
  when:
    - etcd_servers is undefined
    - etcd_stacked_mode

- name: ControlPlane | Build external etcd endpoints | 生成外部 etcd 地址列表
  ansible.builtin.set_fact:
    etcd_servers: >-
      {%- set cluster = [] -%}
      {%- for host in groups['etcd'] -%}
        {%- set ip = hostvars[host]['internal_ip'] | default(hostvars[host]['ansible_host']) -%}
        {%- set port = hostvars[host]['etcd_client_port'] | default(2379) -%}
        {%- set _ = cluster.append('https://' ~ ip ~ ':' ~ port) -%}
      {%- endfor -%}
      {{ cluster | join(',') }}
  when:
    - etcd_servers is undefined
    - not etcd_stacked_mode

- name: ControlPlane | Skip installation when disabled | 按配置跳过安装
  ansible.builtin.meta: end_host
  when: kube_master_no_install

# 组件安装 | Install binaries and certs
- name: ControlPlane | Copy control-plane binaries | 下发控制面二进制
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/packages/kube/{{ ansible_architecture }}/{{ item }}"
    dest: "{{ bin_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - "kube-apiserver"
    - "kube-controller-manager"
    - "kube-scheduler"
    - "kubectl"
    - "helm"

- name: ControlPlane | Generate TLS certificates | 生成 TLS 证书
  ansible.builtin.include_tasks: "gen_ssl.yaml"

- name: ControlPlane | Configure apiserver audit policy | 配置 apiserver 审计
  ansible.builtin.include_tasks: "kube_audit.yaml"
  when: enable_apiserver_audit

# 服务文件下发 | Deploy service units
- name: ControlPlane | Render systemd unit files | 渲染 systemd 服务文件
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - "kube-apiserver.service"
    - "kube-controller-manager.service"
    - "kube-scheduler.service"

- name: ControlPlane | Reload systemd and stop old processes | 重载 systemd 并停止旧进程
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  failed_when: false
  loop:
    - "kube-apiserver"
    - "kube-controller-manager"
    - "kube-scheduler"

- name: ControlPlane | Ensure services are enabled and running | 确保组件开机自启并运行
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - "kube-apiserver"
    - "kube-controller-manager"
    - "kube-scheduler"

# 健康检查 | Health check
- name: ControlPlane | Check component health | 检查控制面健康状态
  ansible.builtin.command: "{{ bin_dir }}/kubectl get componentstatuses"
  register: kube_health
  retries: 3
  delay: 3
  until: kube_health.rc == 0
  changed_when: false

- name: ControlPlane | Show health check output | 输出健康检查结果
  ansible.builtin.debug:
    msg: "{{ kube_health.stdout_lines }}"

- name: ControlPlane | Configure bootstrap RBAC | 配置 bootstrap RBAC
  ansible.builtin.include_tasks: "kube_rbac.yaml"
  run_once: true
